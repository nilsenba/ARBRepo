name: Qlik Promote

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - 'release/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate committed assets
        shell: pwsh
        run: ./scripts/validate-assets.ps1

  deploy-dev:
    name: Deploy DEV
    needs: validate
    if: github.ref == 'refs/heads/dev'
    environment: DEV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Promote to DEV
        shell: pwsh
        run: ./scripts/deploy-dev.ps1

  deploy-uat:
    name: Deploy UAT
    needs: validate
    if: startsWith(github.ref, 'refs/heads/release/')
    environment: UAT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Promote to UAT
        shell: pwsh
        run: ./scripts/deploy-uat.ps1

  deploy-prod:
    name: Deploy PROD
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    environment: PROD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Promote to PROD
        shell: pwsh
        run: ./scripts/deploy-prod.ps1
